<div
    #trigger
    class="playlist-switcher-trigger is-brand-only"
    data-test-id="playlist-switcher-trigger"
>
    @if (activePlaylist(); as active) {
        <app-source-tile
            size="sm"
            [playlist]="active"
            [status]="activeStatus()"
        />
    } @else {
        <span class="trigger-placeholder-tile" aria-hidden="true">
            <mat-icon>live_tv</mat-icon>
        </span>
    }
    <span class="playlist-info">
        <span class="name">NKTV</span>
        <span class="channels-count">Streaming Brasil</span>
    </span>
</div>
